<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Preventive Maintenance - Udon Thani Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==================== BASE & RESET ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Kanit', sans-serif;
      background-color: #f8fafc; 
      color: #334155;
    }

    .app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==================== HEADER ==================== */
    .header {
      background: linear-gradient(135deg, #d81b60 0%, #ad1457 100%); 
      padding: 20px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      z-index: 10;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo {
      height: 48px;
      width: auto;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px;
    }

    .header-text h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }

    .header-text p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 0;
      font-weight: 300;
    }

    .connection-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 9999px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      background-color: #4ade80;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
    }

    .status-indicator.offline {
      background-color: #f87171;
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.6);
    }

    /* ==================== NAV TABS ==================== */
    .nav-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      padding: 0 24px;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none; 
    }
    
    .nav-tabs::-webkit-scrollbar { display: none; } 

    .tab-btn {
      padding: 16px 20px;
      background: none;
      border: none;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #d81b60;
    }

    .tab-btn.active {
      color: #d81b60;
      font-weight: 600;
      border-bottom-color: #d81b60;
    }

    /* ==================== MAIN CONTENT ==================== */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== DASHBOARD CARD ==================== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .dashboard-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border-top: 4px solid #d81b60;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .dashboard-card.warning { border-top-color: #f59e0b; }
    .dashboard-card.error { border-top-color: #ef4444; }
    .dashboard-card.success { border-top-color: #10b981; }

    .card-icon { font-size: 28px; margin-bottom: 16px; }
    .card-label { font-size: 14px; color: #64748b; margin-bottom: 8px; font-weight: 500; }
    .card-value { font-size: 36px; font-weight: 700; color: #1e293b; margin-bottom: 8px; line-height: 1; }
    .dashboard-card:not(.warning):not(.error):not(.success) .card-value { color: #d81b60; }
    .card-detail { font-size: 13px; color: #94a3b8; font-weight: 400; }

    .chart-container {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 32px;
      border: 1px solid #f1f5f9;
    }

    .chart-title {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      align-items: center;
    }

    .chart-label {
      min-width: 160px;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
    }

    .chart-bar-container {
      flex: 1;
      background: #f1f5f9;
      border-radius: 8px;
      overflow: hidden;
      height: 28px;
      position: relative;
    }

    .chart-bar-fill {
      background: linear-gradient(90deg, #f472b6 0%, #d81b60 100%);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ==================== SEARCH SECTION ==================== */
    .search-section {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 28px;
      border: 1px solid #f1f5f9;
    }

    .search-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input-wrapper {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 20px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Kanit', sans-serif;
      transition: all 0.2s ease;
      background: #f8fafc;
      color: #334155;
    }

    .search-input:focus {
      outline: none;
      border-color: #d81b60;
      box-shadow: 0 0 0 4px rgba(216, 27, 96, 0.1);
      background: white;
    }

    .search-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-qr, .btn-search, .btn-clear {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qr {
      background: #fdf2f8;
      color: #d81b60;
      border: 1px solid #fbcfe8;
    }
    .btn-qr:hover:not(:disabled) { background: #fce7f3; }

    .btn-search {
      background: #d81b60;
      color: white;
      box-shadow: 0 4px 10px rgba(216, 27, 96, 0.2);
    }
    .btn-search:hover:not(:disabled) {
      background: #be185d;
      box-shadow: 0 6px 14px rgba(216, 27, 96, 0.3);
      transform: translateY(-1px);
    }

    .btn-clear {
      background: #f1f5f9;
      color: #64748b;
    }
    .btn-clear:hover:not(:disabled) { background: #e2e8f0; color: #334155; }

    /* ==================== ASSET LIST & CARD ==================== */
    .assets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* ลดขนาด min-width ลงเล็กน้อยให้แสดงบนมือถือได้ดี */
      gap: 24px;
      margin-bottom: 32px;
    }

    .asset-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      border-left: 6px solid #d81b60; /* ทำให้แถบสีซ้ายหนาขึ้นนิดหน่อยเหมือนในภาพ */
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      width: 100%;
      position: relative;
    }

    .asset-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-left-color: #be185d;
    }

    .asset-card.abnormal { border-left-color: #f59e0b; background-color: #fffbeb; }

    .asset-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap; /* ป้องกัน Badge ดันออกนอก Card ถ้าข้อความยาว */
    }

    .asset-id { 
      font-size: 20px; 
      font-weight: 700; 
      color: #d81b60; /* ปรับสีตัวอักษร ID เป็นชมพูเข้มตามดีไซน์ */
      line-height: 1.3;
      word-break: break-word; /* ตัดคำหากเลขยาวเกิน */
      flex: 1 1 auto;
      min-width: 0;
    }
    
    .dept-badge {
      background: linear-gradient(135deg, #f9a8d4 0%, #f472b6 100%); /* เปลี่ยนพื้นหลังเป็นชมพู */
      color: white; /* เปลี่ยนตัวอักษรเป็นสีขาว */
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      word-break: break-word; /* ตัดคำหากชื่อแผนกยาวเกิน */
      text-align: center;
      max-width: 100%;
      box-shadow: 0 2px 6px rgba(244, 114, 182, 0.3);
    }

    .asset-serial { 
      font-size: 13px; 
      color: #94a3b8; 
      margin-bottom: 16px;
      font-family: 'Kanit', sans-serif; /* เปลี่ยนจาก monospace เป็น Kanit เพื่อความนุ่มนวล */
      word-break: break-all; /* ตัดคำเพื่อป้องกัน SN ยาวล้นกรอบ */
      display: block;
    }
    
    .asset-details { 
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .asset-details p { 
      display: flex; 
      flex-wrap: wrap; /* ยอมให้ข้อความ value ตกลงมาบรรทัดใหม่ถ้าพื้นที่ไม่พอ */
      align-items: baseline; 
      gap: 4px 8px; 
      margin: 0;
      width: 100%;
    }
    
    .detail-label { 
      font-size: 14px; 
      color: #d81b60; /* เปลี่ยนสี Label เป็นสีบานเย็น */
      font-weight: 600; 
      white-space: nowrap; /* ไม่ให้คำใน Label ฉีกออกจากกัน */
    }
    
    .detail-value {
      font-size: 14px;
      color: #475569;
      font-weight: 500;
      word-break: break-word; /* ให้ข้อความยาวๆ ตัดขึ้นบรรทัดใหม่ได้ */
      flex: 1 1 0%;
      min-width: 120px;
    }
    
    .highlight { 
      background: #fef08a; 
      color: #854d0e;
      padding: 0 4px; 
      border-radius: 4px; 
      font-weight: 600; 
    }

    /* ==================== MODAL OVERLAY & POPUP ==================== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.show { display: flex; justify-content: center; align-items: center; }

    .modal {
      background: white;
      border-radius: 20px;
      max-width: 680px;
      width: 95%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(40px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 24px 32px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: #fffbfa;
      border-radius: 20px 20px 0 0;
    }

    .modal-title { font-size: 20px; font-weight: 600; color: #1e293b; word-break: break-word; }
    .modal-close { 
      background: #f1f5f9; 
      border: none; 
      width: 36px; height: 36px; 
      border-radius: 50%; 
      color: #64748b; 
      cursor: pointer; 
      font-size: 20px; 
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; 
      flex-shrink: 0;
    }
    .modal-close:hover { background: #e2e8f0; color: #0f172a; }
    
    .modal-body { 
      padding: 32px; 
      overflow-y: auto; 
      flex: 1; 
      background: #f8fafc;
    }
    
    .modal-footer { 
      padding: 20px 32px; 
      border-top: 1px solid #e2e8f0; 
      display: flex; gap: 12px; 
      justify-content: flex-end; 
      background: white; 
      border-radius: 0 0 20px 20px; 
    }

    .btn-modal { 
      padding: 12px 24px; 
      border: none; 
      border-radius: 10px; 
      font-family: 'Kanit', sans-serif; 
      font-size: 15px; 
      font-weight: 500; 
      cursor: pointer; 
      transition: all 0.2s ease; 
    }
    .btn-primary { 
      background: #d81b60; 
      color: white; 
      box-shadow: 0 4px 6px -1px rgba(216, 27, 96, 0.2); 
    }
    .btn-primary:hover:not(:disabled) { 
      transform: translateY(-1px); 
      background: #be185d; 
      box-shadow: 0 6px 10px -1px rgba(216, 27, 96, 0.3);
    }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-secondary:hover:not(:disabled) { background: #e2e8f0; color: #1e293b; }

    /* ==================== DYNAMIC CHECKLIST ==================== */
    .pm-category { 
      margin-bottom: 24px; 
      background: white; 
      padding: 24px; 
      border-radius: 16px; 
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .category-name { 
      font-size: 16px; 
      font-weight: 600; 
      color: #334155; 
      margin-bottom: 20px; 
      display: flex; align-items: center; gap: 10px; 
      border-bottom: 2px solid #f1f5f9; 
      padding-bottom: 12px; 
      word-break: break-word;
    }
    
    .checklist-item { 
      display: flex; flex-direction: column; gap: 10px; 
      margin-bottom: 20px; 
    }
    .checklist-item:last-child { margin-bottom: 0; }
    
    .checklist-control { display: flex; gap: 12px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
    
    .form-input { 
      padding: 12px 16px; 
      border: 1px solid #cbd5e1; 
      border-radius: 10px; 
      flex: 1 1 auto; 
      font-family: 'Kanit'; 
      font-size: 15px;
      transition: all 0.2s;
      min-width: 150px;
    }
    .form-input:focus {
      outline: none;
      border-color: #d81b60;
      box-shadow: 0 0 0 3px rgba(216, 27, 96, 0.1);
    }

    .form-check { 
      width: 24px; 
      height: 24px; 
      cursor: pointer; 
      accent-color: #d81b60;
    }
    
    .form-file {
      font-family: 'Kanit';
      font-size: 13px;
    }

    /* ==================== ALERTS / LOADERS ==================== */
    .notification-toast { 
      position: fixed; top: 24px; right: 24px; 
      background: white; padding: 16px 20px; 
      border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); 
      z-index: 2000; animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
      display: flex; gap: 12px; align-items: center; 
      border-left: 4px solid #d81b60; 
      max-width: 90vw;
      word-break: break-word;
    }
    @keyframes slideInRight { 
      from { transform: translateX(100%); opacity: 0; } 
      to { transform: translateX(0); opacity: 1; } 
    }
    .notification-toast.success { border-left-color: #10b981; }
    
    .loading-overlay { 
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(4px); 
      z-index: 9999; justify-content: center; align-items: center; flex-direction: column; 
    }
    .loading-overlay.show { display: flex; }
    .spinner { 
      width: 48px; height: 48px; 
      border: 4px solid #fbcfe8; 
      border-top-color: #d81b60; 
      border-radius: 50%; 
      animation: spin 0.8s linear infinite; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 20px; font-size: 15px; color: #475569; font-weight: 500; }

    .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 1px dashed #cbd5e1; width: 100%; word-break: break-word;}
    .empty-state-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.8; }
    .empty-state-text { font-size: 16px; font-weight: 500; color: #64748b; }

    /* ==================== RESPONSIVE (MOBILE) ==================== */
    @media (max-width: 768px) {
      .header { padding: 16px; }
      .header-content { flex-direction: column; align-items: flex-start; gap: 16px; }
      .header-text h1 { font-size: 20px; }
      .connection-badge { align-self: flex-start; }
      
      .main-content { padding: 16px; }
      
      .dashboard-grid { grid-template-columns: 1fr; gap: 16px; }
      
      .search-container { flex-direction: column; align-items: stretch; }
      .search-input-wrapper { min-width: 100%; }
      .search-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .btn-clear { grid-column: span 2; justify-content: center; }
      .btn-search, .btn-qr { justify-content: center; }
      
      .assets-grid { grid-template-columns: 1fr; gap: 16px; }
      
      .modal-header, .modal-body, .modal-footer { padding: 20px; }
      .modal-footer { flex-direction: column; }
      .btn-modal { width: 100%; }
      
      .pm-category { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- HEADER -->
    <div class="header">
      <div class="header-content">
        <div class="header-left">
          <img src="./favicon.png" class="header-logo" alt="Logo" onerror="this.style.display='none'">
          <div class="header-text">
            <h1 id="sysTitle">IT PREVENTIVE SYSTEM</h1>
            <p id="hospitalName">โรงพยาบาลอุดรธานี</p>
            <p id="deptName">กลุ่มงานเทคโนโลยีสารสนเทศคอมพิวเตอร์ โทร 1125, 1126, 1485</p>
          </div>
        </div>
        <div class="connection-badge">
          <span class="status-indicator" id="connIndicator"></span>
          <span id="connText">เชื่อมต่อระบบหลัก</span>
        </div>
      </div>
    </div>

    <div class="nav-tabs" id="navTabs">
      <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
      <button class="tab-btn" data-tab="assets" onclick="switchTab('assets')">📦 Assets & บันทึก PM</button>
      <button class="tab-btn" data-tab="completed" onclick="switchTab('completed')">✅ Completed</button>
      <button class="tab-btn" data-tab="abnormal" onclick="switchTab('abnormal')">⚠️ Abnormal</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div class="container">
        
        <!-- DASHBOARD VIEW -->
        <div class="tab-panel active" id="tab-dashboard">
          <div class="dashboard-grid" id="dashboardGrid"></div>
          <div class="chart-container">
            <div class="chart-title">📊 สัดส่วนตามประเภทครุภัณฑ์ (Asset Types)</div>
            <div id="chartContainer"></div>
          </div>
        </div>

        <!-- ASSETS VIEW -->
        <div class="tab-panel" id="tab-assets">
          <div class="search-section">
            <div class="search-container">
              <div class="search-input-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="พิมพ์เลขรหัสครุภัณฑ์, Serial Number หรือชื่อแผนก..." autocomplete="off">
              </div>
              <div class="search-buttons">
                <button class="btn-qr" id="btnQR" title="สแกน QR Code"><span>📷</span> QR Scan</button>
                <button class="btn-search" id="btnSearch" title="ค้นหา"><span>🔍</span> ค้นหา</button>
                <button class="btn-clear" id="btnClear" title="ล้างการค้นหา"><span>✕</span> ล้าง</button>
              </div>
            </div>
          </div>
          <div class="assets-grid" id="assetsGrid"></div>
        </div>

        <!-- COMPLETED VIEW -->
        <div class="tab-panel" id="tab-completed">
          <div class="assets-grid" id="completedContainer"></div>
        </div>

        <!-- ABNORMAL VIEW -->
        <div class="tab-panel" id="tab-abnormal">
          <div class="assets-grid" id="abnormalContainer"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">กำลังดึงข้อมูลงานจริง...</div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">บันทึกผลการตรวจเช็ค PM</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- ฟอร์ม Checklist โหลดแบบ Dynamic ตามประเภท Col23 ที่นี่ -->
      </div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn-modal btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn-modal btn-primary" id="btnSubmitPM" onclick="submitPMForm()">บันทึกข้อมูลเข้าระบบหลัก</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="notificationContainer"></div>

  <!-- CAMERA QR HIDDEN INPUT -->
  <input type="file" id="qrFileInput" accept="image/*" style="display: none;" onchange="handleQRUpload(event)">

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8UHJAO4hBK9kYX_tZ1JrZSPtujTOAuFtVvHrjiHzk6O7D3ZUDQv5cMbEs8hEl8TqR3g/exec";
    
    let allAssets = [];
    let filteredAssets = [];
    let pmHistory = [];
    let abnormalList = [];
    let pmTopics = [];
    let pmCategories = [];
    let currentSearchQuery = '';
    let selectedAsset = null;

    // เริ่มต้นแอปพลิเคชัน
    document.addEventListener('DOMContentLoaded', async () => {
      await initializeApp();
    });

    async function initializeApp() {
      showLoading(true, 'กำลังโหลดข้อมูลจาก Google Sheets (ระบบจริง)...');
      setConnectionStatus(true, 'กำลังโหลดข้อมูล...');
      try {
        await Promise.all([
          loadAssets(), 
          loadPMHistory(), 
          loadAbnormalList(),
          loadPMTopics(),
          loadPMCategories()
        ]);
        setupEventListeners();
        renderDashboard();
        setConnectionStatus(true, 'ระบบเชื่อมต่อสำเร็จ');
        showNotification('success', 'เชื่อมต่อระบบฐานข้อมูลจริงเรียบร้อยแล้ว');
      } catch (err) {
        setConnectionStatus(false, 'การเชื่อมต่อขัดข้อง');
        showNotification('error', 'เชื่อมต่อล้มเหลว: ' + err.message);
        renderConnectionError(err.message);
      } finally {
        showLoading(false);
      }
    }

    async function loadAssets() {
      const response = await fetch(`${SCRIPT_URL}?action=getAssets`);
      if (!response.ok) throw new Error('HTTP status ' + response.status);
      const result = await response.json();
      if (result.status) {
        allAssets = result.data || [];
        filteredAssets = [...allAssets];
      } else {
        throw new Error(result.message || 'โครงสร้างข้อมูลสเปรดชีตไม่ถูกต้อง');
      }
    }

    async function loadPMHistory() {
      const response = await fetch(`${SCRIPT_URL}?action=getPMHistory`);
      if (!response.ok) throw new Error('HTTP status ' + response.status);
      const result = await response.json();
      pmHistory = result.status ? (result.data || []) : [];
    }

    async function loadAbnormalList() {
      const response = await fetch(`${SCRIPT_URL}?action=getAbnormalPM`);
      if (!response.ok) throw new Error('HTTP status ' + response.status);
      const result = await response.json();
      abnormalList = result.status ? (result.data || []) : [];
    }

    async function loadPMTopics() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPMTopics`);
        if (!response.ok) throw new Error('HTTP status ' + response.status);
        const result = await response.json();
        pmTopics = result.status ? (result.data || []) : [];
      } catch (err) {
        console.warn('โหลด getPMTopics ไม่สำเร็จ ลองเรียกผ่าน getPMTopic...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getPMTopic`);
          const result = await response.json();
          pmTopics = result.status ? (result.data || []) : [];
        } catch (subErr) {
          console.error('ไม่สามารถดึงข้อมูลตาราง PM_TOPIC จริงได้:', subErr);
          pmTopics = [];
        }
      }
    }

    async function loadPMCategories() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPMCategories`);
        if (!response.ok) throw new Error('HTTP status ' + response.status);
        const result = await response.json();
        pmCategories = result.status ? (result.data || []) : [];
      } catch (err) {
        console.warn('โหลด getPMCategories ไม่สำเร็จ ลองเรียกผ่าน getPMCategory...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getPMCategory`);
          const result = await response.json();
          pmCategories = result.status ? (result.data || []) : [];
        } catch (subErr) {
          console.error('ไม่สามารถดึงข้อมูลตาราง PM_CATEGORY จริงได้:', subErr);
          pmCategories = [];
        }
      }
    }

    function setupEventListeners() {
      const searchInput = document.getElementById('searchInput');
      
      searchInput.addEventListener('input', (e) => {
        performSearch(e.target.value);
      });

      document.getElementById('btnSearch').addEventListener('click', () => {
        performSearch(searchInput.value);
      });

      document.getElementById('btnQR').addEventListener('click', () => {
        document.getElementById('qrFileInput').click();
      });

      document.getElementById('btnClear').addEventListener('click', () => {
        searchInput.value = '';
        currentSearchQuery = '';
        filteredAssets = [...allAssets];
        renderAssets();
      });
    }

    function performSearch(query) {
      currentSearchQuery = query.trim().toUpperCase();
      if (!currentSearchQuery) {
        filteredAssets = [...allAssets];
      } else {
        filteredAssets = allAssets.filter(asset => {
          const id = (asset.Asset_ID || '').toString().toUpperCase();
          const sn = (asset.Serial_Number || '').toString().toUpperCase();
          const dept = (asset.Dept_Name || '').toString().toUpperCase();
          return id.includes(currentSearchQuery) || sn.includes(currentSearchQuery) || dept.includes(currentSearchQuery);
        });
      }
      renderAssets();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      const clickedBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
      if (clickedBtn) clickedBtn.classList.add('active');

      if (tabName === 'assets') renderAssets();
      if (tabName === 'completed') renderCompletedList();
      if (tabName === 'abnormal') renderAbnormalListPanel();
    }

    function renderDashboard() {
      const grid = document.getElementById('dashboardGrid');
      grid.innerHTML = '';

      const total = allAssets.length;
      const done = pmHistory.length;
      const fail = abnormalList.length;
      const wait = Math.max(0, total - done);

      const cards = [
        { icon: '📦', label: 'จำนวนครุภัณฑ์ทั้งหมดในฐานข้อมูล', value: total, detail: 'จากระบบหลักโรงพยาบาลอุดรฯ', color: 'success' },
        { icon: '✅', label: 'ทำ PM ผ่านการตรวจสอบ', value: done, detail: 'เป่าฝุ่นและเช็คสภาวะปกติ', color: 'success' },
        { icon: '⚠️', label: 'ตรวจพบชำรุดเสียหาย', value: fail, detail: 'รอส่งรายการเสนอซ่อมบำรุง', color: 'error' },
        { icon: '⏳', label: 'รายการที่ยังคงค้าง PM', value: wait, detail: 'เป้าหมายที่ต้องเช็คต่อในรอบสัปดาห์', color: 'warning' }
      ];

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = `dashboard-card ${card.color}`;
        div.innerHTML = `
          <div class="card-icon">${card.icon}</div>
          <div class="card-label">${card.label}</div>
          <div class="card-value">${card.value}</div>
          <div class="card-detail">${card.detail}</div>
        `;
        grid.appendChild(div);
      });

      renderAssetChart();
    }

    function renderAssetChart() {
      const container = document.getElementById('chartContainer');
      const types = {};
      allAssets.forEach(a => {
        const t = a.Asset_Group_Name || 'ไม่ระบุประเภท';
        types[t] = (types[t] || 0) + 1;
      });

      const max = Math.max(...Object.values(types), 1);
      let html = '';
      Object.keys(types).forEach(t => {
        const count = types[t];
        const pct = (count / max) * 100;
        html += `
          <div class="chart-bar">
            <div class="chart-label">${escapeHtml(t)}</div>
            <div class="chart-bar-container">
              <div class="chart-bar-fill" style="width: ${pct}%">${count} เครื่อง</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html || '<p class="text-gray-400 text-center text-sm py-4">ไม่พบโครงสร้างกลุ่มประเภทครุภัณฑ์</p>';
    }

    function renderAssets() {
      const grid = document.getElementById('assetsGrid');
      if (!currentSearchQuery) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">🔎</div>
          <div class="empty-state-text">กรุณากรอกรหัสครุภัณฑ์หรือแผนกที่ติดตั้งในช่องด้านบน เพื่อเปิดหน้าบันทึก PM</div>
        </div>`;
        return;
      }

      const query = currentSearchQuery.toLowerCase().trim();

      let matchedAssets = filteredAssets.filter(asset => {
        const id = String(asset.Asset_ID || "").toLowerCase();
        const dept = String(asset.Dept_Name || "").toLowerCase();
        const sn = String(asset.Serial_Number || "").toLowerCase();

        return id.includes(query) || dept.includes(query) || sn.includes(query);
      });

      matchedAssets.sort((a, b) => {
        const getRightToLeftScore = (asset) => {
          const id = String(asset.Asset_ID || "").toLowerCase();
          const dept = String(asset.Dept_Name || "").toLowerCase();

          if (id === query) return 100;
          if (id.endsWith(query)) return 90;

          const lastIdx = id.lastIndexOf(query);
          if (lastIdx !== -1) {
            return 10 + (lastIdx / id.length) * 50;
          }

          if (dept.includes(query)) return 5;
          return 0;
        };

        return getRightToLeftScore(b) - getRightToLeftScore(a);
      });

      if (matchedAssets.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">📦</div>
          <div class="empty-state-text">ไม่พบข้อมูลรหัสครุภัณฑ์ไอทีนี้ในฐานข้อมูล Google Sheets ปัจจุบัน</div>
        </div>`;
        return;
      }

      grid.innerHTML = '';
      filteredAssets.forEach(asset => {
        const typeNameToDisplay = asset.Asset_Group_Name || 'ไม่ระบุประเภท';
        const detail = asset.Asset_DB_Col8 || 'ไม่มีบันทึก';

        const card = document.createElement('div');
        card.className = 'asset-card';
        card.innerHTML = `
          <div class="asset-header">
            <div class="asset-id">${highlightText(asset.Asset_ID || '', currentSearchQuery)}</div>
            <div class="dept-badge">${escapeHtml(asset.Dept_Name || 'ไม่พบคลังหน่วยงาน')}</div>
          </div>
          <div class="asset-serial">SN: ${highlightText(asset.Serial_Number || 'N/A', currentSearchQuery)}</div>
          <div class="asset-details">
            <p><span class="detail-label">ประเภทอุปกรณ์:</span><span class="detail-value" style="font-weight: 600; color: #1e293b;">${escapeHtml(typeNameToDisplay)}</span></p>
            <p><span class="detail-label">รายละเอียด:</span><span class="detail-value">${escapeHtml(detail)}</span></p>
          </div>
        `;
        card.onclick = () => openPMPanel(asset);
        grid.appendChild(card);
      });
    }

    function renderCompletedList() {
      const container = document.getElementById('completedContainer');
      if (pmHistory.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">✅</div>
          <div class="empty-state-text">ยังไม่พบบันทึกประวัติที่ตรวจเช็คผ่านการทดสอบ PM ในฐานข้อมูลสัปดาห์นี้</div>
        </div>`;
        return;
      }
      container.innerHTML = pmHistory.map(pm => `
        <div class="asset-card">
          <div class="asset-header">
            <div class="asset-id">${escapeHtml(pm.Asset_ID)}</div>
            <div class="dept-badge" style="background: linear-gradient(135deg, #34d399 0%, #10b981 100%);">ผ่านเกณฑ์ปกติ</div>
          </div>
          <div class="asset-details">
            <p><span class="detail-label">ผู้รับผิดชอบ:</span><span class="detail-value" style="font-weight: 600; color: #1e293b;">${escapeHtml(pm.Checker_Name || 'เจ้าหน้าที่ไอที')}</span></p>
            <p><span class="detail-label">วันที่ตรวจสภาพ:</span><span class="detail-value">${escapeHtml(pm.Check_Date || 'N/A')}</span></p>
            <p><span class="detail-label">รายละเอียด:</span><span class="detail-value">${escapeHtml(pm.Note || '-')}</span></p>
          </div>
        </div>
      `).join('');
    }

    function renderAbnormalListPanel() {
      const container = document.getElementById('abnormalContainer');
      if (abnormalList.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">🛡️</div>
          <div class="empty-state-text">ยินดีด้วย! ไม่พบรายการอุปกรณ์ที่ตรวจสภาพเป็นล้มเหลว/ชำรุดในขณะนี้</div>
        </div>`;
        return;
      }
      container.innerHTML = abnormalList.map(ab => `
        <div class="asset-card abnormal">
          <div class="asset-header">
            <div class="asset-id">${escapeHtml(ab.Asset_ID)}</div>
            <div class="dept-badge" style="background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);">ตรวจพบชำรุด</div>
          </div>
          <div class="asset-details">
            <p><span class="detail-label">รายละเอียดขัดข้อง:</span><span class="detail-value" style="color:#ef4444; font-weight:600;">${escapeHtml(ab.Issue_Details || 'N/A')}</span></p>
            <p><span class="detail-label">ติดตั้งที่แผนก:</span><span class="detail-value" style="font-weight: 600; color: #1e293b;">${escapeHtml(ab.Dept_Name || 'N/A')}</span></p>
            <p><span class="detail-label">ผู้รายงานปัญหา:</span><span class="detail-value">${escapeHtml(ab.Checker_Name || 'N/A')}</span></p>
          </div>
        </div>
      `).join('');
    }

    async function openPMPanel(asset) {
      selectedAsset = asset;
      const modal = document.getElementById('modalOverlay');
      const modalBody = document.getElementById('modalBody');
      const modalTitle = document.getElementById('modalTitle');
      
      modalTitle.innerHTML = `
        <div style="font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #1e293b; word-break: break-word;">🔧 ระบบบันทึกงาน PM: ${escapeHtml(asset.Asset_ID || '')}</div>
        <div style="font-size: 14px; font-weight: normal; color: #475569; line-height: 1.6;">
          <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
            <div style="flex: 1 1 0%; min-width: 140px; word-break: break-word;"><span style="color:#94a3b8; font-size:12px;">ชื่อพาร์ทครุภัณฑ์:</span> <br><strong style="color: #d81b60;">${escapeHtml(asset.Asset_Name || asset.Asset_ID || 'N/A')}</strong></div>
            <div style="flex: 1 1 0%; min-width: 140px; word-break: break-word; text-align: left;"><span style="color:#94a3b8; font-size:12px;">ประเภทอุปกรณ์:</span> <br><strong>${escapeHtml(asset.Asset_Group_Name || 'N/A')}</strong></div>
          </div>
          <div style="margin-top:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; border-top: 1px solid #e2e8f0; padding-top:8px;">
            <div style="flex: 1 1 0%; min-width: 140px; word-break: break-all;"><span style="color:#94a3b8; font-size:12px;">Serial Number:</span> <br><strong>${escapeHtml(asset.Serial_Number || 'N/A')}</strong></div>
            <div style="flex: 1 1 0%; min-width: 140px; word-break: break-word; text-align: left;"><span style="color:#94a3b8; font-size:12px;">แผนก/หน่วยงาน:</span> <br><strong>${escapeHtml(asset.Dept_Name || 'ไม่พบคลังหน่วยงาน')}</strong></div>
          </div>
          <div style="margin-top:8px; border-top: 1px solid #e2e8f0; padding-top:8px; word-break: break-word;">
            <span style="color:#94a3b8; font-size:12px;">ข้อมูลรายละเอียดครุภัณฑ์:</span> <br>
            <span>${escapeHtml(asset.Asset_DB_Col8 || 'N/A')}</span>
          </div>
        </div>
      `;
      
      modalBody.innerHTML = '<p style="text-align:center; padding: 20px; color: #64748b;">กำลังโหลดรายการเช็คลิสต์...</p>';
      modal.classList.add('show');

      const typeToSearch = asset.Asset_Type_ID;
      
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPMTopics&assetType=${encodeURIComponent(typeToSearch)}`);
        const res = await response.json();

        if (res.status && res.data && res.data.length > 0) {
          let html = "";
          let lastCategory = ""; 

          res.data.forEach(topic => {
            const categoryName = topic.category_name || 'การประเมินและตรวจสภาพทั่วไป';
            const topicName = topic.topic_name || '';
            const inputType = String(topic.input_type || "").toLowerCase().trim();
            const isCritical = topic.critical === true;
            const isPhotoRequired = topic.photo_required === true;

            if (categoryName !== lastCategory) {
              if (lastCategory !== "") html += `</div>`; 
              html += `<div class="pm-category"><div class="category-name">📁 ${escapeHtml(categoryName)}</div>`;
              lastCategory = categoryName;
            }

            let inputHtml = "";
            if (inputType === 'checkbox') {
                inputHtml = `<input type="checkbox" class="form-check">`;
            } else if (inputType === 'number' || inputType === 'score') {
                inputHtml = `<input type="number" min="${topic.min_score}" max="${topic.max_score}" class="form-input" placeholder="คะแนน">`;
            } else if (inputType === 'text') {
                inputHtml = `<input type="text" class="form-input" placeholder="ระบุรายละเอียด">`;
            } else {
                inputHtml = `<input type="text" class="form-input" placeholder="ระบุข้อมูล">`; 
            }

            html += `
              <div class="checklist-item">
                <label style="font-size: 15px; font-weight: 500; color: #334155; word-break: break-word;">${escapeHtml(topicName)} ${isCritical ? '<span style="color:#ef4444; font-size:11px; font-weight: 600; background: #fee2e2; padding: 2px 6px; border-radius: 4px; margin-left: 4px; white-space: nowrap;">จำเป็น</span>' : ''}</label>
                <div class="checklist-control">
                  ${inputHtml}
                  ${isPhotoRequired ? '<label class="btn-secondary" style="padding: 10px 14px; font-size: 13px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;">📷 แนบรูป<input type="file" accept="image/*" class="form-file" style="display:none;"></label>' : ''}
                </div>
              </div>`;
          });
          
          html += `</div>`; 
          modalBody.innerHTML = html;
        } else {
          modalBody.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📄</div><div class="empty-state-text">ไม่พบรายการเช็คลิสต์สำหรับ ID: ${escapeHtml(typeToSearch)}</div></div>`;
        }
      } catch (err) {
        modalBody.innerHTML = `<div class="empty-state" style="border-color: #fca5a5; background: #fef2f2;"><div class="empty-state-icon" style="color: #ef4444;">❌</div><div class="empty-state-text" style="color: #b91c1c;">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div></div>`;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    function handleQRUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      showNotification('success', 'รับภาพถ่ายแล้ว กรุณาพิมพ์หมายเลขครุภัณฑ์ในช่องค้นหาเพื่อค้นหาอย่างรวดเร็ว');
    }

    function setConnectionStatus(isOnline, text) {
      const indicator = document.getElementById('connIndicator');
      const textEl = document.getElementById('connText');
      
      if (isOnline) {
        indicator.className = 'status-indicator';
        textEl.innerText = text || 'เชื่อมต่อระบบหลัก';
      } else {
        indicator.className = 'status-indicator offline';
        textEl.innerText = text || 'การเชื่อมต่อขาดหาย';
      }
    }

    function renderConnectionError(errMsg) {
      const grid = document.getElementById('dashboardGrid');
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1; background: #fef2f2; border: 2px solid #fecaca; border-radius: 16px; padding: 40px;">
          <div class="empty-state-icon" style="opacity: 1; color: #ef4444;">🚨</div>
          <div class="empty-state-text" style="color: #b91c1c; font-weight: 600; font-size: 18px; margin-bottom: 8px;">การเชื่อมต่อ Google Apps Script Web App ขัดข้อง</div>
          <p style="font-size: 14px; color: #475569; max-width: 600px; margin: 0 auto 16px auto; line-height: 1.6;">
            ระบบนี้เชื่อมต่อตรงผ่าน LIVE API สตรีมเรียลไทม์เท่านั้น และไม่มีการจำลองข้อมูลไว้ภายนอก 
            กรุณาตรวจสอบการตั้งค่า Deploy ใน Apps Script ของคุณว่าเป็น "Anyone" หรืออาจติดขัดด้านนโยบาย CORS จากภายนอก
          </p>
          <p style="font-size: 13px; font-family: 'Kanit', sans-serif; color: #94a3b8; margin-bottom: 24px; word-break: break-word;">ข้อผิดพลาด: ${escapeHtml(errMsg)}</p>
          <button onclick="initializeApp()" class="btn-primary" style="padding: 12px 32px;">🔄 ลองเชื่อมต่อใหม่อีกครั้ง</button>
        </div>
      `;
    }

    function showLoading(show, text = 'กำลังดำเนินการ...') {
      const overlay = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').innerText = text;
      if (show) overlay.classList.add('show');
      else overlay.classList.remove('show');
    }

    function showNotification(type, message) {
      const container = document.getElementById('notificationContainer');
      const toast = document.createElement('div');
      toast.className = `notification-toast ${type}`;
      
      let icon = 'ℹ️';
      if (type === 'success') icon = '✅';
      if (type === 'error') icon = '❌';
      if (type === 'warning') icon = '⚠️';

      toast.innerHTML = `
        <span style="font-size: 20px;">${icon}</span>
        <div style="font-size: 14px; font-weight: 500; color: #334155; word-break: break-word;">${escapeHtml(message)}</div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = "slideInRight 0.3s ease reverse";
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function highlightText(text, query) {
      if (!query) return escapeHtml(text);
      const regex = new RegExp(`(${query})`, 'gi');
      return escapeHtml(text).replace(regex, '<span class="highlight">$1</span>');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
