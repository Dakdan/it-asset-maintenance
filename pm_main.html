<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Preventive Maintenance - Udon Thani Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==================== DESIGN TOKENS & RESET ==================== */
    :root {
      --primary: #e11d48;      /* Rose 600 */
      --primary-hover: #be123c;/* Rose 700 */
      --primary-light: #ffe4e6;/* Rose 100 */
      --bg-main: #f8fafc;      /* Slate 50 */
      --card-bg: #ffffff;
      --text-main: #0f172a;    /* Slate 900 */
      --text-muted: #64748b;   /* Slate 500 */
      --text-light: #94a3b8;   /* Slate 400 */
      --border-light: #e2e8f0; /* Slate 200 */
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%; width: 100%;
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .app-wrapper {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ==================== MODERN HEADER ==================== */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, #9f1239 100%);
      padding: 16px 24px;
      z-index: 20;
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.15);
    }

    .header-content {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .header-logo {
      height: 48px; width: auto;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px;
      box-shadow: var(--shadow-sm);
    }

    .header-text h1 {
      font-size: 20px; font-weight: 700; color: #ffffff;
      margin-bottom: 2px; letter-spacing: 0.5px; line-height: 1.2;
    }

    .header-text p {
      font-size: 13px; color: rgba(255, 255, 255, 0.85);
      margin-bottom: 0; font-weight: 400;
    }

    .connection-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 999px;
      color: white; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap; transition: all 0.3s;
    }

    .status-indicator {
      width: 8px; height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
    }
    .status-indicator.offline {
      background-color: #f87171;
      box-shadow: 0 0 12px rgba(248, 113, 113, 0.8);
    }

    /* ==================== SLEEK NAV TABS ==================== */
    .nav-tabs {
      display: flex; background: var(--card-bg);
      padding: 0 24px; gap: 16px;
      border-bottom: 1px solid var(--border-light);
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      overflow-x: auto; scrollbar-width: none; 
    }
    .nav-tabs::-webkit-scrollbar { display: none; } 

    .tab-btn {
      padding: 16px 8px;
      background: none; border: none;
      font-family: 'Prompt', sans-serif; font-size: 15px; font-weight: 500;
      color: var(--text-muted); cursor: pointer;
      position: relative; white-space: nowrap;
      transition: color 0.2s ease;
    }
    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active { color: var(--primary); font-weight: 600; }
    .tab-btn::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0; right: 0; height: 3px;
      background-color: transparent; border-radius: 3px 3px 0 0;
      transition: background-color 0.2s ease;
    }
    .tab-btn.active::after { background-color: var(--primary); }

    /* ==================== MAIN CONTENT ==================== */
    .main-content {
      flex: 1; overflow-y: auto; padding: 24px 20px;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== DASHBOARD ==================== */
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }

    .dashboard-card {
      background: var(--card-bg);
      border-radius: var(--radius-md); padding: 16px 20px;
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; position: relative; overflow: hidden;
    }
    .dashboard-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: transparent; }
    
    /* Top accent line instead of border */
    .dashboard-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--border-light);
    }
    .dashboard-card.info::before { background: #3b82f6; }
    .dashboard-card.success::before { background: var(--success); }
    .dashboard-card.warning::before { background: var(--warning); }
    .dashboard-card.error::before { background: var(--error); }

    .card-icon {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      background: #f1f5f9; border-radius: 10px; font-size: 18px; margin-bottom: 12px;
    }
    .dashboard-card.info .card-icon { background: #eff6ff; }
    .dashboard-card.success .card-icon { background: #ecfdf5; }
    .dashboard-card.warning .card-icon { background: #fffbeb; }
    .dashboard-card.error .card-icon { background: #fef2f2; }

    .card-label { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-bottom: 2px; }
    .card-value { font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; line-height: 1.1; }
    .card-detail { font-size: 12px; color: var(--text-light); }

    /* ==================== CHART ==================== */
    .chart-container {
      background: var(--card-bg); border-radius: var(--radius-md);
      padding: 20px 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      margin-bottom: 24px;
    }
    .chart-title { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 16px; }
    .chart-bar { display: flex; gap: 16px; margin-bottom: 12px; align-items: center; }
    .chart-label { min-width: 160px; max-width: 160px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .chart-bar-container { flex: 1; background: #f1f5f9; border-radius: 99px; overflow: hidden; height: 20px; }
    .chart-bar-fill {
      background: linear-gradient(90deg, #f43f5e 0%, var(--primary) 100%);
      height: 100%; display: flex; align-items: center; justify-content: flex-end;
      padding-right: 12px; color: white; font-size: 11px; font-weight: 600;
      min-width: 60px; white-space: nowrap; border-radius: 99px;
    }

    /* ==================== SEARCH BAR ==================== */
    .search-section {
      background: var(--card-bg); padding: 16px 20px;
      border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light); margin-bottom: 24px;
    }
    .search-container { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .search-input-wrapper { flex: 1; min-width: 240px; position: relative; }
    
    .search-input {
      width: 100%; padding: 10px 16px;
      border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 14px; font-family: 'Prompt', sans-serif;
      background: #f8fafc; color: var(--text-main); transition: all 0.2s;
    }
    .search-input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light); background: white;
    }

    .search-buttons { display: flex; gap: 8px; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 8px;
      font-family: 'Prompt', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; justify-content: center;
    }
    .btn-qr { background: var(--primary-light); color: var(--primary-hover); }
    .btn-qr:hover:not(:disabled) { background: #fecdd3; }
    .btn-search { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(225, 29, 72, 0.2); }
    .btn-search:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-clear { background: #f1f5f9; color: var(--text-muted); }
    .btn-clear:hover:not(:disabled) { background: #e2e8f0; color: var(--text-main); }

    /* ==================== ASSET CARDS (RE-DESIGNED) ==================== */
    .assets-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px; margin-bottom: 10px;
    }

    .asset-card {
      background: var(--card-bg);
      border-radius: var(--radius-md); padding: 8px 12px;
      font-size: 0.85rem;
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      cursor: pointer; display: flex; flex-direction: column;
      transition: all 0.2s ease;
      position: relative;
    }
    .asset-card:hover {
      transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #fecdd3;
    }

    /* Remove heavy borders, use subtle tag for status if needed */
    .asset-card.abnormal { border-color: #fcd34d; background: #fffbeb; }
    .asset-card.completed { border-color: #a7f3d0; background: #f0fdf4; }

    .asset-header {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;
    }

    .asset-id { 
      font-size: 17px; font-weight: 700; color: var(--primary-hover); 
      word-break: break-word; line-height: 1.2;
    }
    
    .dept-badge {
      align-self: flex-start;
      background-color: var(--primary-light); color: var(--primary-hover); 
      padding: 2px 10px; border-radius: 6px;
      font-size: 12px; font-weight: 600;
      word-break: break-word; text-align: left;
    }
    
    .asset-card.completed .dept-badge { background-color: #d1fae5; color: #047857; }
    .asset-card.abnormal .dept-badge { background-color: #fef3c7; color: #b45309; }

    .asset-serial { 
      font-size: 12px; color: var(--text-light); 
      margin-bottom: 12px; word-break: break-all;
      background: #f1f5f9; padding: 2px 6px; border-radius: 4px; display: inline-block;
      width: fit-content;
    }
    
    .asset-details { display: flex; flex-direction: column; gap: 6px; margin-top: auto; border-top: 1px dashed var(--border-light); padding-top: 12px;}
    .asset-details p { 
      display: flex; flex-direction: column; gap: 0px; margin: 0; 
    }
    .detail-label { 
      font-size: 11px; color: var(--text-light); font-weight: 500; 
    }
    .detail-value {
      font-size: 14px; color: var(--text-main); font-weight: 500;
      word-break: break-word; line-height: 1.3;
    }
    
    .highlight { 
      background: #bbf7d0; color: #166534; padding: 0 4px; 
      border-radius: 4px; font-weight: 600; 
    }

    /* ==================== MODAL (PREMIUM LOOK) ==================== */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px);
      z-index: 1000; padding: 20px;
    }
    .modal-overlay.show { display: flex; justify-content: center; align-items: center; animation: fadeInOverlay 0.3s ease; }
    @keyframes fadeInOverlay { from{opacity:0;} to{opacity:1;} }

    .modal {
      background: var(--card-bg); border-radius: var(--radius-xl);
      width: 100%; max-width: 720px; max-height: 90vh;
      display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalSlideUp {
      from { transform: translateY(40px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border-light);
      display: flex; justify-content: space-between; align-items: flex-start;
      background: #ffffff; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }
    .modal-title-wrapper { display: flex; flex-direction: column; gap: 4px; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--text-main); word-break: break-word; }
    .modal-subtitle { font-size: 13px; color: var(--text-muted); }
    
    .modal-close { 
      background: #f1f5f9; border: none; width: 32px; height: 32px; 
      border-radius: 50%; color: var(--text-muted); cursor: pointer; 
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.2s; 
    }
    .modal-close:hover { background: #e2e8f0; color: var(--text-main); }
    
    .modal-body { padding: 24px; overflow-y: auto; flex: 1; background: #f8fafc; }
    .modal-footer { 
      padding: 16px 24px; border-top: 1px solid var(--border-light); 
      display: flex; gap: 12px; justify-content: flex-end; 
      background: white; border-radius: 0 0 var(--radius-xl) var(--radius-xl); 
    }

    /* ==================== DYNAMIC CHECKLIST ==================== */
    .modal-info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
      background: white; padding: 16px; border-radius: var(--radius-md);
      border: 1px solid var(--border-light); margin-bottom: 20px;
    }
    .info-block { display: flex; flex-direction: column; gap: 2px; word-break: break-word; }
    .info-label { font-size: 11px; color: var(--text-light); }
    .info-val { font-size: 13px; color: var(--text-main); font-weight: 600; line-height: 1.3;}

    .pm-category { 
      margin-bottom: 20px; background: white; padding: 20px; 
      border-radius: var(--radius-md); border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .category-name { 
      font-size: 15px; font-weight: 700; color: var(--text-main); 
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px; 
      padding-bottom: 12px; border-bottom: 1px dashed var(--border-light);
      word-break: break-word;
    }
    
    .checklist-item { 
      display: flex; flex-direction: column; gap: 6px; 
      margin-bottom: 16px; 
    }
    .checklist-item:last-child { margin-bottom: 0; }
    
    .checklist-control { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    
    .form-input { 
      padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; 
      flex: 1 1 auto; font-family: 'Prompt'; font-size: 14px; color: var(--text-main);
      transition: all 0.2s; min-width: 150px; background: #f8fafc;
    }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background: white; }
    .form-check { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }
    .form-file { font-family: 'Prompt'; font-size: 12px; }

    /* ==================== MISC ==================== */
    .notification-toast { 
      position: fixed; top: 24px; right: 24px; 
      background: white; padding: 12px 16px; border-radius: var(--radius-md); 
      box-shadow: var(--shadow-lg); z-index: 2000; 
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
      display: flex; gap: 10px; align-items: center; border-left: 4px solid var(--primary); 
      max-width: 90vw; word-break: break-word;
    }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .notification-toast.success { border-left-color: var(--success); }
    
    .loading-overlay { 
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px); 
      z-index: 9999; justify-content: center; align-items: center; flex-direction: column; 
    }
    .loading-overlay.show { display: flex; }
    .spinner { 
      width: 40px; height: 40px; border: 3px solid var(--primary-light); 
      border-top-color: var(--primary); border-radius: 50%; 
      animation: spin 0.8s linear infinite; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 16px; font-size: 14px; color: var(--text-muted); font-weight: 500; }

    .empty-state { 
      text-align: center; padding: 48px 20px; background: white; 
      border-radius: var(--radius-md); border: 2px dashed var(--border-light); 
      width: 100%; word-break: break-word;
    }
    .empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state-text { font-size: 14px; font-weight: 500; color: var(--text-muted); }

    /* ==================== RESPONSIVE (MOBILE) ==================== */
    @media (max-width: 768px) {
      .header { padding: 12px 16px; }
      .header-content { flex-direction: column; align-items: flex-start; gap: 8px; }
      .header-text h1 { font-size: 16px; }
      .connection-badge { padding: 6px 12px; font-size: 12px; }
      
      .nav-tabs { padding: 0 16px; }
      .main-content { padding: 16px 12px; }
      
      .dashboard-grid { grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
      .search-section { padding: 12px; margin-bottom: 16px; }
      .search-container { flex-direction: column; align-items: stretch; gap: 10px; }
      .search-input-wrapper { min-width: 100%; }
      .search-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .btn-clear { grid-column: span 2; }
      
      .assets-grid { grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
      
      .modal { border-radius: 16px; max-height: calc(100vh - 24px); }
      .modal-header { padding: 16px; border-radius: 16px 16px 0 0; }
      .modal-title { font-size: 16px; }
      .modal-body { padding: 16px; }
      .modal-footer { padding: 16px; flex-direction: column; border-radius: 0 0 16px 16px; }
      .btn { width: 100%; }
      
      .modal-info-grid { grid-template-columns: 1fr; gap: 10px; padding: 12px; margin-bottom: 16px; }
      .pm-category { padding: 16px; margin-bottom: 16px; }
      .chart-container { padding: 16px; margin-bottom: 16px; }
      .chart-label { min-width: 90px; max-width: 90px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- HEADER -->
    <div class="header">
      <div class="header-content">
        <div class="header-left">
          <img src="./favicon.png" class="header-logo" alt="Logo" onerror="this.style.display='none'">
          <div class="header-text">
            <h1 id="sysTitle">IT PREVENTIVE SYSTEM</h1>
            <p id="hospitalName">โรงพยาบาลอุดรธานี</p>
            <p id="deptName" style="margin-top:2px;">กลุ่มงานเทคโนโลยีสารสนเทศคอมพิวเตอร์ โทร 1125, 1126, 1485</p>
          </div>
        </div>
        <div class="connection-badge">
          <span class="status-indicator" id="connIndicator"></span>
          <span id="connText">เชื่อมต่อระบบหลัก</span>
        </div>
      </div>
    </div>

    <div class="nav-tabs" id="navTabs">
      <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
      <button class="tab-btn" data-tab="assets" onclick="switchTab('assets')">📦 Assets & บันทึก PM</button>
      <button class="tab-btn" data-tab="completed" onclick="switchTab('completed')">✅ Completed</button>
      <button class="tab-btn" data-tab="abnormal" onclick="switchTab('abnormal')">⚠️ Abnormal</button>
      <button class="tab-btn" data-tab="report" onclick="switchTab('report')">📄 รายงาน</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div class="container">
        
        <!-- DASHBOARD VIEW -->
        <div class="tab-panel active" id="tab-dashboard">
          <div class="dashboard-grid" id="dashboardGrid"></div>
          <div class="chart-container">
            <div class="chart-title">📊 สัดส่วนตามประเภทครุภัณฑ์ (Asset Types)</div>
            <div id="chartContainer"></div>
          </div>
        </div>

        <!-- ASSETS VIEW -->
        <div class="tab-panel" id="tab-assets">
          <div class="search-section">
            <div class="search-container">
              <div class="search-input-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="พิมพ์เลขรหัสครุภัณฑ์, Serial Number หรือชื่อแผนก..." autocomplete="off">
              </div>
              <div class="search-buttons">
                <button class="btn btn-qr" id="btnQR" title="สแกน QR Code">📷 QR Scan</button>
                <button class="btn btn-search" id="btnSearch" title="ค้นหา">🔍 ค้นหา</button>
                <button class="btn btn-clear" id="btnClear" title="ล้างการค้นหา">✕ ล้าง</button>
              </div>
            </div>
          </div>
          <div class="assets-grid" id="assetsGrid"></div>
        </div>

        <!-- COMPLETED VIEW -->
        <div class="tab-panel" id="tab-completed">
          <div class="assets-grid" id="completedContainer"></div>
        </div>

        <!-- ABNORMAL VIEW -->
        <div class="tab-panel" id="tab-abnormal">
          <div class="assets-grid" id="abnormalContainer"></div>
        </div>
        <div id="tab-report" class="tab-panel">
          <div id="reportContainer">กำลังโหลดข้อมูล...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">กำลังดึงข้อมูลงานจริง...</div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title-wrapper" id="modalTitleWrapper">
          <h2 class="modal-title" id="modalTitle">บันทึกผลการตรวจเช็ค PM</h2>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- ฟอร์ม Checklist โหลดแบบ Dynamic ตามประเภท Col23 ที่นี่ -->
      </div>
      <div class="modal-footer" id="modalFooter">
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" id="btnSubmitPM" onclick="submitPMForm()">บันทึกข้อมูลเข้าระบบหลัก</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="notificationContainer"></div>

  <!-- CAMERA QR HIDDEN INPUT -->
  <input type="file" id="qrFileInput" accept="image/*" style="display: none;" onchange="handleQRUpload(event)">

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8UHJAO4hBK9kYX_tZ1JrZSPtujTOAuFtVvHrjiHzk6O7D3ZUDQv5cMbEs8hEl8TqR3g/exec";
    
    let allAssets = [];
    let filteredAssets = [];
    let pmHistory = [];
    let abnormalList = [];
    let pmTopics = [];
    let pmCategories = [];
    let currentSearchQuery = '';
    let selectedAsset = null;

    // เริ่มต้นแอปพลิเคชัน
    document.addEventListener('DOMContentLoaded', async () => {
      await initializeApp();
    });

    async function initializeApp() {
      showLoading(true, 'กำลังโหลดข้อมูล ...');
      setConnectionStatus(true, 'กำลังโหลดข้อมูล...');
      try {
        await Promise.all([
          loadAssets(), 
          loadPMHistory(), 
          loadAbnormalList(),
          loadPMTopics(),
          loadPMCategories()
        ]);
        setupEventListeners();
        renderDashboard();
        setConnectionStatus(true, 'ระบบเชื่อมต่อสำเร็จ');
        showNotification('success', 'เชื่อมต่อระบบฐานข้อมูลจริงเรียบร้อยแล้ว');
      } catch (err) {
        setConnectionStatus(false, 'การเชื่อมต่อขัดข้อง');
        showNotification('error', 'เชื่อมต่อล้มเหลว: ' + err.message);
        renderConnectionError(err.message);
      } finally {
        showLoading(false);
      }
    }

    async function loadAssets() {
      const response = await fetch(`${SCRIPT_URL}?action=getAssets`);
      if (!response.ok) throw new Error('HTTP status ' + response.status);
      const result = await response.json();
      if (result.status) {
        allAssets = result.data || [];
        filteredAssets = [...allAssets];
      } else {
        throw new Error(result.message || 'โครงสร้างข้อมูลสเปรดชีตไม่ถูกต้อง');
      }
    }

    async function loadPMHistory() {
      const response = await fetch(`${SCRIPT_URL}?action=getPMHistory`);
      if (!response.ok) throw new Error('HTTP status ' + response.status);
      const result = await response.json();
      pmHistory = result.status ? (result.data || []) : [];
    }

    async function loadAbnormalList() {
      const response = await fetch(`${SCRIPT_URL}?action=getAbnormalPM`);
      if (!response.ok) throw new Error('HTTP status ' + response.status);
      const result = await response.json();
      abnormalList = result.status ? (result.data || []) : [];
    }

    async function loadPMTopics() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPMTopics`);
        if (!response.ok) throw new Error('HTTP status ' + response.status);
        const result = await response.json();
        pmTopics = result.status ? (result.data || []) : [];
      } catch (err) {
        console.warn('โหลด getPMTopics ไม่สำเร็จ ลองเรียกผ่าน getPMTopic...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getPMTopic`);
          const result = await response.json();
          pmTopics = result.status ? (result.data || []) : [];
        } catch (subErr) {
          console.error('ไม่สามารถดึงข้อมูลตาราง PM_TOPIC จริงได้:', subErr);
          pmTopics = [];
        }
      }
    }

    async function loadPMCategories() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPMCategories`);
        if (!response.ok) throw new Error('HTTP status ' + response.status);
        const result = await response.json();
        pmCategories = result.status ? (result.data || []) : [];
      } catch (err) {
        console.warn('โหลด getPMCategories ไม่สำเร็จ ลองเรียกผ่าน getPMCategory...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getPMCategory`);
          const result = await response.json();
          pmCategories = result.status ? (result.data || []) : [];
        } catch (subErr) {
          console.error('ไม่สามารถดึงข้อมูลตาราง PM_CATEGORY จริงได้:', subErr);
          pmCategories = [];
        }
      }
    }

    function setupEventListeners() {
      const searchInput = document.getElementById('searchInput');
      
      searchInput.addEventListener('input', (e) => {
        performSearch(e.target.value);
      });

      document.getElementById('btnSearch').addEventListener('click', () => {
        performSearch(searchInput.value);
      });

      document.getElementById('btnQR').addEventListener('click', () => {
        document.getElementById('qrFileInput').click();
      });

      document.getElementById('btnClear').addEventListener('click', () => {
        searchInput.value = '';
        currentSearchQuery = '';
        filteredAssets = [...allAssets];
        renderAssets();
      });
    }

    function performSearch(query) {
      currentSearchQuery = query.trim().toUpperCase();
      if (!currentSearchQuery) {
        filteredAssets = [...allAssets];
      } else {
        filteredAssets = allAssets.filter(asset => {
          const id = (asset.Asset_ID || '').toString().toUpperCase();
          const sn = (asset.Serial_Number || '').toString().toUpperCase();
          const dept = (asset.Dept_Name || '').toString().toUpperCase();
          return id.includes(currentSearchQuery) || sn.includes(currentSearchQuery) || dept.includes(currentSearchQuery);
        });
      }
      renderAssets();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      const clickedBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
      if (clickedBtn) clickedBtn.classList.add('active');

      if (tabName === 'assets') renderAssets();
      if (tabName === 'completed') renderCompletedList();
      if (tabName === 'abnormal') renderAbnormalListPanel();
      if (tabName === 'report') renderReport();
    }

    function renderDashboard() {
      const grid = document.getElementById('dashboardGrid');
      grid.innerHTML = '';

      const total = allAssets.length;
      const done = pmHistory.length;
      const fail = abnormalList.length;
      const wait = Math.max(0, total - done);

      const cards = [
        { icon: '📦', label: 'จำนวนครุภัณฑ์ทั้งหมด', value: total, detail: 'จากฐานข้อมูลหลัก', color: 'info' },
        { icon: '✅', label: 'ทำ PM ผ่านแล้ว', value: done, detail: 'ตรวจเช็คสภาวะปกติ', color: 'success' },
        { icon: '⚠️', label: 'ผิดปกติ/ไม่ผ่านเกณฑ์', value: fail, detail: 'รอเสนอซ่อมบำรุง', color: 'error' },
        { icon: '⏳', label: 'คงค้างการ PM', value: wait, detail: 'เป้าหมายที่ต้องเช็คต่อ', color: 'warning' }
      ];

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = `dashboard-card ${card.color}`;
        div.innerHTML = `
          <div class="card-icon">${card.icon}</div>
          <div class="card-label">${card.label}</div>
          <div class="card-value">${card.value}</div>
          <div class="card-detail">${card.detail}</div>
        `;
        grid.appendChild(div);
      });

      renderAssetChart();
    }

    function renderAssetChart() {
      const container = document.getElementById('chartContainer');
      const types = {};
      allAssets.forEach(a => {
        const t = a.Asset_Group_Name || 'ไม่ระบุประเภท';
        types[t] = (types[t] || 0) + 1;
      });

      const max = Math.max(...Object.values(types), 1);
      let html = '';
      Object.keys(types).forEach(t => {
        const count = types[t];
        const pct = (count / max) * 100;
        html += `
          <div class="chart-bar">
            <div class="chart-label">${escapeHtml(t)}</div>
            <div class="chart-bar-container">
              <div class="chart-bar-fill" style="width: ${pct}%">${count} เครื่อง</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html || '<p class="empty-state-text py-4">ไม่พบโครงสร้างกลุ่มประเภทครุภัณฑ์</p>';
    }

    function renderAssets() {
      const grid = document.getElementById('assetsGrid');
      if (!currentSearchQuery) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">🔎</div>
          <div class="empty-state-text">กรุณากรอกรหัสครุภัณฑ์หรือแผนกที่ติดตั้ง เพื่อเปิดหน้าบันทึก PM</div>
        </div>`;
        return;
      }

      const query = currentSearchQuery.toLowerCase().trim();

      let matchedAssets = filteredAssets.filter(asset => {
        const id = String(asset.Asset_ID || "").toLowerCase();
        const dept = String(asset.Dept_Name || "").toLowerCase();
        const sn = String(asset.Serial_Number || "").toLowerCase();

        return id.includes(query) || dept.includes(query) || sn.includes(query);
      });

      matchedAssets.sort((a, b) => {
        const getRightToLeftScore = (asset) => {
          const id = String(asset.Asset_ID || "").toLowerCase();
          const dept = String(asset.Dept_Name || "").toLowerCase();
          if (id === query) return 100;
          if (id.endsWith(query)) return 90;
          const lastIdx = id.lastIndexOf(query);
          if (lastIdx !== -1) return 10 + (lastIdx / id.length) * 50;
          if (dept.includes(query)) return 5;
          return 0;
        };
        return getRightToLeftScore(b) - getRightToLeftScore(a);
      });

      if (matchedAssets.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">📦</div>
          <div class="empty-state-text">ไม่พบข้อมูลครุภัณฑ์ที่ตรงกับการค้นหา ในฐานข้อมูลปัจจุบัน</div>
        </div>`;
        return;
      }

      grid.innerHTML = '';
      matchedAssets.forEach(asset => {
        const typeNameToDisplay = asset.Asset_Group_Name || 'ไม่ระบุประเภท';
        const detail = asset.Asset_DB_Col8 || 'ไม่มีบันทึก';

        let nameHtml = '';
        if (asset.Asset_Name && asset.Asset_Name.trim() !== asset.Asset_ID.trim()) {
          nameHtml = `<p><span class="detail-label">ชื่ออุปกรณ์</span><span class="detail-value">${escapeHtml(truncateText(asset.Asset_Name, 40))}</span></p>`;
        }

        const card = document.createElement('div');
        card.className = 'asset-card';
        card.innerHTML = `
          <div class="asset-header">
            <div class="asset-id">${highlightText(asset.Asset_ID || '', currentSearchQuery)}</div>
            <div class="dept-badge">${escapeHtml(asset.Dept_Name || 'ไม่พบคลังหน่วยงาน')}</div>
          </div>
          <div class="asset-serial">SN: ${highlightText(asset.Serial_Number || '-', currentSearchQuery)}</div>
          <div class="asset-details">
            ${nameHtml}
            <p><span class="detail-label">ประเภทอุปกรณ์</span><span class="detail-value" style="font-weight: 600; color: var(--text-main);">${escapeHtml(typeNameToDisplay)}</span></p>
            <p><span class="detail-label">รายละเอียด</span><span class="detail-value" title="${escapeHtml(detail)}">${escapeHtml(truncateText(detail, 50))}</span></p>
          </div>
        `;
        card.onclick = () => openPMPanel(asset);
        grid.appendChild(card);
      });
    }

    function renderCompletedList() {
      const container = document.getElementById('completedContainer');
      if (pmHistory.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">✅</div>
          <div class="empty-state-text">ยังไม่พบบันทึกประวัติที่ตรวจเช็คผ่านการทดสอบ PM ในรอบนี้</div>
        </div>`;
        return;
      }
      container.innerHTML = pmHistory.map(pm => `
        <div class="asset-card completed">
          <div class="asset-header">
            <div class="asset-id" style="color: var(--success);">${escapeHtml(pm.Asset_ID)}</div>
            <div class="dept-badge" style="background: #d1fae5; color: #047857;">ผ่านเกณฑ์ปกติ</div>
          </div>
          <div class="asset-details">
            <p><span class="detail-label">ผู้รับผิดชอบ</span><span class="detail-value">${escapeHtml(pm.Checker_Name || 'เจ้าหน้าที่ไอที')}</span></p>
            <p><span class="detail-label">วันที่ตรวจสภาพ</span><span class="detail-value">${escapeHtml(pm.Check_Date || 'N/A')}</span></p>
            <p><span class="detail-label">รายละเอียด</span><span class="detail-value" title="${escapeHtml(pm.Note || '-')}">${escapeHtml(truncateText(pm.Note || '-', 50))}</span></p>
          </div>
        </div>
      `).join('');
    }

    function renderAbnormalListPanel() {
      const container = document.getElementById('abnormalContainer');
      if (abnormalList.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-state-icon">🛡️</div>
          <div class="empty-state-text">ยินดีด้วย! ไม่พบรายการอุปกรณ์ที่ตรวจสภาพชำรุดในขณะนี้</div>
        </div>`;
        return;
      }

      container.innerHTML = abnormalList.map(ab => {
        // ค้นหาแผนกจากข้อมูลหลักอัตโนมัติ ถ้าค่าที่ส่งมาเป็นค่าว่าง
        let realDept = ab.Dept_Name;
        if (!realDept || realDept === 'รอดึงข้อมูลแผนก') {
          const asset = allAssets.find(a => a.Asset_ID === ab.Asset_ID);
          realDept = asset && asset.Dept_Name ? asset.Dept_Name : 'ไม่ระบุหน่วยงาน';
        }

        return `
        <div class="asset-card abnormal">
          <div class="asset-header">
            <div class="asset-id" style="color: #b45309;">${escapeHtml(ab.Asset_ID)}</div>
            <div class="dept-badge" style="background: #fef3c7; color: #b45309;">ตรวจพบชำรุด</div>
          </div>
          <div class="asset-details">
            <p><span class="detail-label">ปัญหาที่พบ</span><span class="detail-value" style="color:var(--error); font-weight:600;" title="${escapeHtml(ab.Issue_Details || '')}">${escapeHtml(truncateText(ab.Issue_Details || 'ไม่มีระบุ', 50))}</span></p>
            <p><span class="detail-label">แผนก</span><span class="detail-value">${escapeHtml(realDept)}</span></p>
            <p><span class="detail-label">ผู้รายงาน</span><span class="detail-value">${escapeHtml(ab.Checker_Name || 'เจ้าหน้าที่')}</span></p>
          </div>
        </div>
        `;
      }).join('');
    }

    async function openPMPanel(asset) {
      selectedAsset = asset;
      const modal = document.getElementById('modalOverlay');
      const modalBody = document.getElementById('modalBody');
      const titleWrapper = document.getElementById('modalTitleWrapper');
      
      titleWrapper.innerHTML = `
        <h2 class="modal-title">🔧 บันทึกงาน PM: <span style="color: var(--primary);">${escapeHtml(asset.Asset_ID || '')}</span></h2>
        <div class="modal-subtitle">โปรดตรวจสอบรายละเอียดและบันทึกผลการทำงาน</div>
      `;

      let nameInfoHtml = '';
      if (asset.Asset_Name && asset.Asset_Name.trim() !== asset.Asset_ID.trim()) {
          nameInfoHtml = `
          <div class="info-block">
              <span class="info-label">ชื่อพาร์ทครุภัณฑ์</span>
              <span class="info-val">${escapeHtml(asset.Asset_Name)}</span>
          </div>`;
      }
      
      modalBody.innerHTML = `
        <div class="modal-info-grid">
            ${nameInfoHtml}
            <div class="info-block">
                <span class="info-label">ประเภทอุปกรณ์</span>
                <span class="info-val">${escapeHtml(asset.Asset_Group_Name || 'N/A')}</span>
            </div>
            <div class="info-block">
                <span class="info-label">Serial Number</span>
                <span class="info-val" style="font-family:monospace; background:#f1f5f9; padding:2px 6px; border-radius:4px; width:fit-content;">${escapeHtml(asset.Serial_Number || '-')}</span>
            </div>
            <div class="info-block">
                <span class="info-label">แผนก/หน่วยงาน</span>
                <span class="info-val">${escapeHtml(asset.Dept_Name || 'ไม่พบคลังหน่วยงาน')}</span>
            </div>
            <div class="info-block" style="grid-column: 1 / -1;">
                <span class="info-label">ข้อมูลรายละเอียดครุภัณฑ์</span>
                <span class="info-val" style="color: var(--text-muted); font-weight: 400;">${escapeHtml(truncateText(asset.Asset_DB_Col8 || 'N/A', 150))}</span>
            </div>
        </div>
        <p style="text-align:center; padding: 20px; color: var(--text-muted);">กำลังโหลดรายการเช็คลิสต์...</p>
      `;
      
      modal.classList.add('show');

      const typeToSearch = asset.Asset_Type_ID;
      
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPMTopics&assetType=${encodeURIComponent(typeToSearch)}`);
        const res = await response.json();

        if (res.status && res.data && res.data.length > 0) {
          let html = document.querySelector('.modal-info-grid').outerHTML; // Keep the info grid
          let lastCategory = ""; 

          res.data.forEach(topic => {
            const categoryName = topic.category_name || 'การประเมินและตรวจสภาพทั่วไป';
            const topicName = topic.topic_name || '';
            const inputType = String(topic.input_type || "").toLowerCase().trim();
            const isCritical = topic.critical === true || String(topic.critical).toUpperCase() === 'TRUE';
            const isPhotoRequired = topic.photo_required === true || String(topic.photo_required).toUpperCase() === 'TRUE';

            // ดึงค่า MIN_SCORE และ MAX_SCORE จากสเปรดชีตผ่าน API เพื่อสร้างตัวเลือกที่ถูกต้อง
            const rawMin = String(topic.min_score !== undefined && topic.min_score !== null ? topic.min_score : "").trim();
            const rawMax = String(topic.max_score !== undefined && topic.max_score !== null ? topic.max_score : "").trim();

            if (categoryName !== lastCategory) {
              if (lastCategory !== "") html += `</div>`; 
              html += `<div class="pm-category"><div class="category-name">📁 ${escapeHtml(categoryName)}</div>`;
              lastCategory = categoryName;
            }

            let inputHtml = "";
            
            // ----------------------------------------------------
            // ตรรกะควบคุมการสร้างรูปแบบอินพุตตามเงื่อนไขในภาพอ้างอิง
            // ----------------------------------------------------
            if (inputType === 'score') {
                // สร้าง Dropdown คะแนนอ้างอิงตั้งแต่ MIN_SCORE ถึง MAX_SCORE
                const minScore = parseInt(rawMin, 10) || 1;
                const maxScore = parseInt(rawMax, 10) || 5;
                inputHtml = `<select class="form-input pm-val" data-tid="${topic.topic_id}">`;
                for (let i = minScore; i <= maxScore; i++) {
                    inputHtml += `<option value="${i}">${i} คะแนน</option>`;
                }
                inputHtml += `</select>`;
                
            } else if (inputType === 'checkbox') {
                // ตัวเลือก ปกติ (1) / ไม่ปกติ (0) ตามกฎที่กำหนด
                inputHtml = `
                <div style="display: flex; gap: 16px; align-items: center; padding: 4px 0;">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--success); font-weight: 600;">
                        <input type="radio" name="chk_${topic.topic_id}" value="1" class="pm-val-radio" style="width: 18px; height: 18px; accent-color: var(--success);"> 
                        ปกติ
                    </label>
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--error); font-weight: 600;">
                        <input type="radio" name="chk_${topic.topic_id}" value="0" class="pm-val-radio" style="width: 18px; height: 18px; accent-color: var(--error);"> 
                        ไม่ปกติ
                    </label>
                </div>`;
                
            } else if (inputType === 'number') {
                // ตัวเลือกกรอกตัวเลข ควบคุมขอบเขตต่ำสุด-สูงสุดตาม MIN_SCORE และ MAX_SCORE
                const minVal = rawMin !== "" ? `min="${rawMin}"` : "";
                const maxVal = rawMax !== "" ? `max="${rawMax}"` : "";
                const placeholder = (rawMin !== "" && rawMax !== "") ? `ระบุตัวเลข (${rawMin}-${rawMax})` : "ระบุตัวเลข";
                inputHtml = `<input type="number" ${minVal} ${maxVal} class="form-input pm-val" data-tid="${topic.topic_id}" placeholder="${placeholder}">`;
                
            } else if (inputType === 'text multi select') {
                // ตัวเลือก Dropdown ดึงค่าตัวเลือก (Labels) จาก MAX_SCORE และค่ารหัสส่งออก (Values) จาก MIN_SCORE
                const values = rawMin.split(',').map(v => v.trim());
                const labels = rawMax.split(',').map(l => l.trim());
                
                inputHtml = `<select class="form-input pm-val" data-tid="${topic.topic_id}">`;
                labels.forEach((label, idx) => {
                    const val = values[idx] !== undefined && values[idx] !== "" ? values[idx] : label;
                    inputHtml += `<option value="${escapeHtml(val)}">${escapeHtml(label)}</option>`;
                });
                inputHtml += `</select>`;
                
            } else {
                // Fallback ตัวเลือกกรอกข้อความทั่วไป
                inputHtml = `<input type="text" class="form-input pm-val" data-tid="${topic.topic_id}" placeholder="ระบุรายละเอียด">`; 
            }

            html += `
              <div class="checklist-item" data-topic="${topic.topic_id}" data-critical="${isCritical}">
                <label style="font-size: 14px; font-weight: 500; color: var(--text-main); word-break: break-word;">
                  ${escapeHtml(topicName)} 
                  ${isCritical ? '<span style="color:var(--error); font-size:11px; font-weight: 700; background: #fee2e2; padding: 2px 6px; border-radius: 4px; margin-left: 6px; white-space: nowrap;">* จำเป็น</span>' : ''}
                </label>
                <div class="checklist-control">
                  ${inputHtml}
                  ${isPhotoRequired ? '<label class="btn btn-secondary" style="padding: 10px 14px; font-size: 13px; margin:0;"><span style="font-size:16px;">📷</span> แนบรูป<input type="file" accept="image/*" class="form-file" style="display:none;"></label>' : ''}
                </div>
              </div>`;
          });
          
          html += `</div>`; 
          modalBody.innerHTML = html;
        } else {
          modalBody.innerHTML = document.querySelector('.modal-info-grid').outerHTML + `<div class="empty-state" style="padding: 40px 20px;"><div class="empty-state-icon">📄</div><div class="empty-state-text">ไม่พบรายการเช็คลิสต์สำหรับ ID: ${escapeHtml(typeToSearch)}</div></div>`;
        }
      } catch (err) {
        modalBody.innerHTML = document.querySelector('.modal-info-grid').outerHTML + `<div class="empty-state" style="border-color: #fca5a5; background: #fef2f2; padding: 40px 20px;"><div class="empty-state-icon" style="color: #ef4444;">❌</div><div class="empty-state-text" style="color: #b91c1c;">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div></div>`;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    async function submitPMForm() {
      if (!selectedAsset) return;
      
      const items = document.querySelectorAll('.checklist-item');
      let details = [];
      let isValid = true;
      let hasFail = false;
      
      items.forEach(item => {
        const tid = item.getAttribute('data-topic');
        const isCritical = item.getAttribute('data-critical') === 'true';
        
        let val = "";
        const textInput = item.querySelector('.pm-val');
        const radioInputs = item.querySelectorAll('.pm-val-radio');
        
        if (textInput) {
          val = textInput.value.trim();
        } else if (radioInputs.length > 0) {
          const checkedRadio = item.querySelector('.pm-val-radio:checked');
          if (checkedRadio) val = checkedRadio.value;
        }
        
        // ตรวจสอบข้อมูลจำเป็น
        if (isCritical && val === "") {
          isValid = false;
          item.style.border = "1px solid var(--error)";
          item.style.padding = "8px";
          item.style.borderRadius = "8px";
          item.style.backgroundColor = "#fef2f2";
        } else {
          item.style.border = "none";
          item.style.padding = "0";
          item.style.backgroundColor = "transparent";
        }
        
        // ประเมินสถานะ PASS/FAIL 
        // สำหรับ Checkbox (Radio): 0 คือ FAIL, 1 คือ PASS
        let status = "PASS";
        if (val === "0" || val === 0) {
          status = "FAIL";
          hasFail = true;
        }
        
        details.push({
          topic_id: tid,
          status: status,
          score: val,
          remark: "" 
        });
      });
      
      if (!isValid) {
        showNotification('warning', 'กรุณากรอกข้อมูลในหัวข้อที่จำเป็น (*) ให้ครบถ้วน');
        return;
      }
      
      const payload = {
        action: 'savePM',
        asset_code: selectedAsset.Asset_ID,
        user: "เจ้าหน้าที่ไอที", 
        result: hasFail ? "FAIL" : "PASS",
        note: hasFail ? "พบความผิดปกติ" : "ปกติ",
        details: details
      };
      
      showLoading(true, 'กำลังบันทึกข้อมูลเข้าระบบหลัก...');
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        const res = await response.json();
        
        if (res.status) {
          showNotification('success', 'บันทึกข้อมูลสำเร็จ! (PM_ID: ' + res.data.pm_id + ')');
          closeModal();
          
          await Promise.all([loadPMHistory(), loadAbnormalList()]);
          renderDashboard();
          
          if (hasFail) switchTab('abnormal');
          else switchTab('completed');
          
        } else {
          showNotification('error', 'ข้อผิดพลาดจากเซิร์ฟเวอร์: ' + res.message);
        }
      } catch (err) {
        console.error(err);
        showNotification('error', 'เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย');
      } finally {
        showLoading(false);
      }
    }

    function handleQRUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      showNotification('success', 'รับภาพถ่ายแล้ว กรุณาพิมพ์หมายเลขครุภัณฑ์ในช่องค้นหาเพื่อสืบค้น');
    }

    function setConnectionStatus(isOnline, text) {
      const indicator = document.getElementById('connIndicator');
      const textEl = document.getElementById('connText');
      
      if (isOnline) {
        indicator.className = 'status-indicator';
        textEl.innerText = text || 'เชื่อมต่อระบบหลัก';
      } else {
        indicator.className = 'status-indicator offline';
        textEl.innerText = text || 'การเชื่อมต่อขาดหาย';
      }
    }

    function renderConnectionError(errMsg) {
      const grid = document.getElementById('dashboardGrid');
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1; background: #fef2f2; border: 2px solid #fecaca; padding: 40px; text-align: left;">
          <div style="display:flex; align-items:center; gap:16px; margin-bottom:16px;">
            <div style="font-size: 32px;">🚨</div>
            <div style="color: #b91c1c; font-weight: 700; font-size: 18px;">การเชื่อมต่อ Google Apps Script Web App ขัดข้อง</div>
          </div>
          <p style="font-size: 14px; color: #475569; margin-bottom: 12px; line-height: 1.6;">
            ระบบนี้เชื่อมต่อตรงผ่าน LIVE API สตรีมเรียลไทม์เท่านั้น และไม่มีการจำลองข้อมูลไว้ภายนอก 
            กรุณาตรวจสอบการตั้งค่า Deploy ใน Apps Script ของคุณว่าเป็น "Anyone" หรืออาจติดขัดด้านนโยบาย CORS
          </p>
          <p style="font-size: 13px; font-family: monospace; color: #94a3b8; margin-bottom: 24px; background:#fff; padding:12px; border-radius:8px; border:1px solid #e2e8f0;">ข้อผิดพลาด: ${escapeHtml(errMsg)}</p>
          <button onclick="initializeApp()" class="btn btn-primary">🔄 ลองเชื่อมต่อใหม่อีกครั้ง</button>
        </div>
      `;
    }

    function showLoading(show, text = 'กำลังดำเนินการ...') {
      const overlay = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').innerText = text;
      if (show) overlay.classList.add('show');
      else overlay.classList.remove('show');
    }

    function showNotification(type, message) {
      const container = document.getElementById('notificationContainer');
      const toast = document.createElement('div');
      toast.className = `notification-toast ${type}`;
      
      let icon = 'ℹ️';
      if (type === 'success') icon = '✅';
      if (type === 'error') icon = '❌';
      if (type === 'warning') icon = '⚠️';

      toast.innerHTML = `
        <span style="font-size: 20px;">${icon}</span>
        <div style="font-size: 14px; font-weight: 500; color: var(--text-main);">${escapeHtml(message)}</div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = "slideInRight 0.3s ease reverse";
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function highlightText(text, query) {
      if (!query) return escapeHtml(text);
      
      // ไฮไลท์จากขวาไปซ้าย (ค้นหาตำแหน่งที่ตรงกันตัวสุดท้าย)
      const strText = String(text);
      const lastIdx = strText.toUpperCase().lastIndexOf(query.toUpperCase());
      
      if (lastIdx === -1) return escapeHtml(text);
      
      const before = escapeHtml(strText.substring(0, lastIdx));
      const match = escapeHtml(strText.substring(lastIdx, lastIdx + query.length));
      const after = escapeHtml(strText.substring(lastIdx + query.length));
      
      return `${before}<span class="highlight">${match}</span>${after}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderReport() {
      const container = document.getElementById('reportContainer');
      container.innerHTML = '<div style="padding:20px;">กำลังจัดกลุ่มรายงาน...</div>';
      
      try {
        const reportData = {};

        // ฟังก์ชันช่วยหาชื่อแผนกจาก allAssets ที่โหลดมาแล้ว
        const getDept = (assetId) => {
          const asset = allAssets.find(a => a.Asset_ID === assetId);
          return asset && asset.Dept_Name ? asset.Dept_Name : "ไม่ระบุหน่วยงาน";
        };

        // 1. ดึงข้อมูล PM ที่ผ่านเกณฑ์มาใส่รายงาน
        pmHistory.forEach(pm => {
          const dept = getDept(pm.Asset_ID);
          if (!reportData[dept]) reportData[dept] = [];
          reportData[dept].push({ Asset_ID: pm.Asset_ID, Result: 'ผ่านเกณฑ์ปกติ' });
        });

        // 2. ดึงข้อมูล PM ที่ชำรุดมาใส่รายงาน
        abnormalList.forEach(ab => {
          const dept = ab.Dept_Name || getDept(ab.Asset_ID);
          if (!reportData[dept]) reportData[dept] = [];
          reportData[dept].push({ Asset_ID: ab.Asset_ID, Result: 'ตรวจพบชำรุด' });
        });

        // เช็คว่ามีข้อมูลหรือไม่
        if (Object.keys(reportData).length === 0) {
           container.innerHTML = '<div class="empty-state" style="margin:20px;"><div class="empty-state-icon">📄</div><div class="empty-state-text">ยังไม่มีประวัติการทำ PM ในระบบ</div></div>';
           return;
        }

        // 3. สร้าง HTML เพื่อแสดงผล
        let html = '<div style="padding:10px;">';
        for (let dept in reportData) {
          html += `<div class="dept-group" style="background:#fff; margin-bottom:15px; padding:15px; border-radius:8px; border-left:5px solid var(--primary); box-shadow: var(--shadow-sm);">
                     <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">
                       <h4 style="margin:0; font-size:16px; color:var(--text-main);">หน่วยงาน: ${escapeHtml(dept)}</h4>
                       <button onclick="window.print()" class="btn btn-secondary" style="padding:6px 12px; cursor:pointer; background:#f1f5f9; border:none; border-radius:6px; font-weight:600;">🖨️ พิมพ์ใบรับรอง</button>
                     </div>
                     <table style="width:100%; font-size:0.85rem; border-collapse:collapse;">
                       ${reportData[dept].map(item => `
                         <tr style="border-bottom:1px solid #f8fafc;">
                           <td style="padding:8px 0; font-weight:500; color:var(--text-main);">${escapeHtml(item.Asset_ID)}</td>
                           <td style="padding:8px 0; text-align:right; font-weight:600; color: ${item.Result === 'ผ่านเกณฑ์ปกติ' ? 'var(--success)' : 'var(--error)'};">${item.Result}</td>
                         </tr>`).join('')}
                     </table>
                   </div>`;
        }
        html += '</div>';
        
        // แสดงผลทันที
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<div style="color: var(--error); padding: 20px;">เกิดข้อผิดพลาดในการประมวลผล: ${err.message}</div>`;
      }
    }

    // ฟังก์ชันช่วยตัดข้อความที่ยาวเกินไป
    function truncateText(text, maxLength) {
      if (!text) return '';
      return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
    }
  </script>
</body>
