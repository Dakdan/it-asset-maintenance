
<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGIN | PM SYSTEM</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {

            --primary: #ec4899;

            --bg-gradient:
                linear-gradient(
                    135deg,
                    #fdf2f8 0%,
                    #ffffff 100%
                );
        }

        body {

            font-family: 'Kanit', sans-serif;

            background: var(--bg-gradient);

            color: #4a4a4a;

            min-height: 100vh;

            overflow-x: hidden;
        }

        .card {

            background: white;

            border-radius: 20px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);
        }

        .btn-primary {

            background: var(--primary);

            color: white;

            border-radius: 50px;

            transition: 0.3s;
        }

        .btn-primary:active {

            transform: scale(0.95);
        }

        .overlay {

            display: none;

            position: fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:
                rgba(255,255,255,0.85);

            z-index: 1000;

            align-items: center;
            justify-content: center;

            flex-direction: column;
        }

        body::after {

            content: "IT UDON HOSP";

            position: fixed;

            font-size: 8vw;

            color:
                rgba(214, 51, 132, 0.03);

            font-weight: 800;

            transform: rotate(-25deg);

            white-space: nowrap;

            z-index: -1;

            pointer-events: none;

            top: 30%;
            left: 10%;
        }

    </style>

</head>

<body>

    <!-- LOADING -->
    <div id="overlay" class="overlay">

        <div class="
            animate-spin
            rounded-full
            h-12
            w-12
            border-t-4
            border-pink-500
            mb-4
        "></div>

        <div class="
            font-bold
            text-pink-500
            text-lg
        ">
            กำลังตรวจสอบข้อมูล...
        </div>

    </div>

    <!-- MODAL -->
    <div
        id="alertModal"

        class="
            hidden
            fixed
            inset-0
            bg-black
            bg-opacity-50
            flex
            items-center
            justify-center
            z-50
            p-4
        "
    >

        <div class="
            bg-white
            rounded-2xl
            p-6
            w-full
            max-w-sm
            text-center
        ">

            <h3
                id="alertTitle"
                class="
                    text-xl
                    font-bold
                    mb-2
                "
            ></h3>

            <p
                id="alertMsg"
                class="
                    text-gray-600
                    mb-6
                "
            ></p>

            <button
                onclick="
                    document
                    .getElementById('alertModal')
                    .classList
                    .add('hidden')
                "

                class="
                    w-full
                    btn-primary
                    py-2
                    font-bold
                "
            >
                ตกลง
            </button>

        </div>

    </div>

    <!-- LOGIN -->
    <div
        class="
            max-w-sm
            mx-auto
            pt-20
            px-4
        "
    >

        <div class="
            card
            p-8
            text-center
            border
            border-pink-100
            bg-white/90
            backdrop-blur-md
        ">

            <div class="
                w-24
                h-24
                mx-auto
                bg-white
                rounded-full
                p-2
                border-2
                border-pink-400
                shadow-lg
                mb-4
                flex
                items-center
                justify-center
                overflow-hidden
            ">

                <img
                    src="https://img2.pic.in.th/-227e4f6f84f29f020.png"

                    alt="Logo"

                    class="
                        w-full
                        h-full
                        object-contain
                    "
                >

            </div>

            <h1 class="
                text-xl
                font-bold
                text-pink-600
                mb-1
            ">
                IT Maintenance And Service
            </h1>

            <p class="
                text-sm
                text-gray-500
                mb-6
            ">
                โรงพยาบาลอุดรธานี
            </p>

            <!-- USERNAME -->
            <div class="text-left mb-3">

                <label class="
                    text-sm
                    text-gray-600
                    ml-2
                ">
                    ชื่อผู้ใช้งาน (Username)
                </label>

                <input
                    type="text"

                    id="username"

                    class="
                        w-full
                        p-3
                        border
                        border-pink-100
                        rounded-xl
                        focus:outline-none
                        focus:border-pink-400
                        focus:ring-2
                        focus:ring-pink-200
                    "

                    required
                >

            </div>

            <!-- PASSWORD -->
            <div class="text-left mb-6">

                <label class="
                    text-sm
                    text-gray-600
                    ml-2
                ">
                    รหัสผ่าน (Password)
                </label>

                <input
                    type="password"

                    id="password"

                    class="
                        w-full
                        p-3
                        border
                        border-pink-100
                        rounded-xl
                        focus:outline-none
                        focus:border-pink-400
                        focus:ring-2
                        focus:ring-pink-200
                    "

                    required
                >

            </div>

            <!-- BUTTON -->
            <button
                onclick="doLogin()"

                class="
                    w-full
                    btn-primary
                    py-3
                    font-bold
                    text-lg
                    shadow-md
                    hover:shadow-lg
                "
            >
                เข้าสู่ระบบ
            </button>

        </div>

    </div>

    <script>

        const GAS_URL =
            "https://script.google.com/macros/s/AKfycbwVwQCHnNmRBS2rh0eOFjr8E1HQmgUZaflQeS2T-N66pYKwWkFBaNv-FBvqyeh3b1lr/exec";

        function showLoading() {

            document
                .getElementById('overlay')
                .style.display = 'flex';
        }

        function hideLoading() {

            document
                .getElementById('overlay')
                .style.display = 'none';
        }

        function showModal(title, msg) {

            document
                .getElementById('alertTitle')
                .innerText = title;

            document
                .getElementById('alertMsg')
                .innerText = msg;

            document
                .getElementById('alertModal')
                .classList
                .remove('hidden');
        }

        async function callAPI(func, data) {

            showLoading();

            try {

                const response =
                    await fetch(
                        GAS_URL,
                        {
                            method: 'POST',

                            mode: 'cors',

                            headers: {
                                'Content-Type':
                                    'text/plain;charset=utf-8'
                            },

                            body:
                                JSON.stringify({
                                    action: func,
                                    ...data
                                }),

                            redirect: 'follow'
                        }
                    );

                return await response.json();

            } catch (e) {

                console.error(e);

                showModal(
                    "Error",
                    "ไม่สามารถเชื่อมต่อ Server ได้"
                );

                return null;

            } finally {

                hideLoading();
            }
        }

        async function doLogin() {

            const user =
                document
                .getElementById('username')
                .value;

            const pass =
                document
                .getElementById('password')
                .value;

            if(!user || !pass) {

                showModal(
                    "แจ้งเตือน",
                    "กรุณากรอก Username และ Password"
                );

                return;
            }

            const res =
                await callAPI(
                    'login',
                    {
                        username: user,
                        password: pass
                    }
                );

            console.log(res);

            if(res && (res.status || res.success)) {

                localStorage.setItem(
                    "PM_USER",
                    JSON.stringify(
                        res.data.user || res.data
                    )
                );

                showModal(
                    "สำเร็จ",
                    "เข้าสู่ระบบสำเร็จ"
                );

                setTimeout(() => {

                    window.location.href =
                        "index.html";

                }, 800);

            } else {

                showModal(
                    "เข้าสู่ระบบล้มเหลว",
                    res?.message ||
                    "Login Failed"
                );
            }
        }

    </script>

</body>
</html>
